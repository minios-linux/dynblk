# Upstream DKMS configuration is version-agnostic. Pass the matching
# dynblk release version explicitly with dkms -m dynblk -v VERSION.
PACKAGE_NAME="dynblk"
PACKAGE_VERSION="${module_version:?pass the dynblk release version with -v}"
BUILT_MODULE_NAME[0]="dynblk"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="no"
BUILD_EXCLUSIVE_KERNEL="^6[.]12[.]"
MAKE[0]="'make' -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build W=1 KCFLAGS=-Werror modules"
CLEAN="'make' -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
